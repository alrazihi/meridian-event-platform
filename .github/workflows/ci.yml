name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Spotless Check
        run: cd backend && mvn -B spotless:check -pl event-domain,event-application,event-infrastructure,event-service
      - name: Run Checkstyle
        run: cd backend && mvn -B checkstyle:check -pl event-domain,event-application,event-infrastructure,event-service

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run OWASP Dependency Check
        run: cd backend && mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Unit Tests
        run: cd backend && mvn -B test -pl event-domain,event-application
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/event-domain/target/site/jacoco/jacoco.xml,./backend/event-application/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${POSTGRES_DB:-meridian}
          POSTGRES_USER: ${POSTGRES_USER:-meridian}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Integration Tests
        run: cd backend && mvn -B verify -pl event-infrastructure,event-service -am -DskipUnitTests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${POSTGRES_DB:-meridian}
          SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-meridian}
          SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-meridian}

  build:
    needs: [lint-and-format, dependency-check, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build Backend
        run: cd backend && mvn -B package -DskipTests -pl event-service -am
      - name: Build Docker Image
        run: docker build -t meridian-event-platform:${{ github.sha }} -f backend/event-service/Dockerfile .



