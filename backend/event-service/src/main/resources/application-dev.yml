server:
  port: 8080
  servlet:
    max-http-header-size: 8KB
    max-http-post-size: 1MB

spring:
  application:
    name: meridian-event-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/meridian
    username: meridian
    password: meridian
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      interceptor.classes: com.meridian.event.infrastructure.observability.KafkaCorrelationIdProducerInterceptor
    consumer:
      group-id: event-platform-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      concurrency: 1
      interceptor.classes: com.meridian.event.infrastructure.observability.KafkaCorrelationIdConsumerInterceptor

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  health:
    db:
      enabled: true
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: dev
    distribution:
      percentiles-histogram:
        http.server.requests: true
        kafka.consumer.records: true
        kafka.producer.records: true
      sla:
        http.server.requests: 500ms,1s,2s,5s

logging:
  level:
    com.meridian: DEBUG
    org.springframework.kafka: DEBUG
    org.springframework.transaction: DEBUG
