apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-event-platform
  namespace: meridian
  labels:
    app: meridian-event-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meridian-event-platform
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: meridian-event-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: meridian-event-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: app
        image: meridian-event-platform:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: meridian-event-platform-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_KAFKA_SASL_JAAS_CONFIG
          valueFrom:
            secretKeyRef:
              name: meridian-event-platform-secrets
              key: SPRING_KAFKA_SASL_JAAS_CONFIG
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: meridian-event-platform-secrets
              key: JWT_PUBLIC_KEY
        envFrom:
        - configMapRef:
            name: meridian-event-platform-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: meridian-event-platform
              topologyKey: kubernetes.io/hostname
