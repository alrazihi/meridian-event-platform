apiVersion: v1
kind: Namespace
metadata:
  name: meridian
  labels:
    name: meridian
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meridian-event-platform
  namespace: meridian
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meridian-event-platform
  namespace: meridian
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meridian-event-platform
  namespace: meridian
subjects:
- kind: ServiceAccount
  name: meridian-event-platform
  namespace: meridian
roleRef:
  kind: Role
  name: meridian-event-platform
  apiGroup: rbac.authorization.k8s.io
